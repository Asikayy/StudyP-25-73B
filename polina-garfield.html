<!DOCTYPE html>

    <title>Гарфилд</title>
</head>
<body>
    <h1>Кот Гарфилд</h1>
    <p>Гарфилд — ленивый, толстый и саркастичный оранжевый кот, который больше всего на свете любит лазанью и ненавидеть понедельники.</p>
    
    <h3>Что любит Гарфилд:</h3>
    <ul>
        <li>Есть лазанью</li>
        <li>Спать весь день</li>
        <li>Подшучивать над хозяином Джоном и псом Оди</li>
    </ul>
</body>
</html>
